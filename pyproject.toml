[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-completed-tasks"
version = "0.1.0"
description = "An Alliance Auth app for reporting task completions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["allianceauth>=4.0"]

[tool.setuptools.packages.find]
include = ["completed_tasks*"]

[tool.setuptools.package-data]
completed_tasks = ["templates/**/*.html"]
