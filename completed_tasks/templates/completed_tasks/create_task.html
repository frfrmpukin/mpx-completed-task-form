{% extends "allianceauth/base-bs5.html" %}

{% block page_title %}Create task{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row"><div class="col-12 col-xl-8">
        <h1 class="h2 mb-2">Create task</h1>
        <p class="text-body-secondary mb-4">Define the task, who can report it, and how completions are reviewed.</p>
        <div class="card"><div class="card-body">
            <form method="post">
                {% csrf_token %}
                {% include "completed_tasks/_form_fields.html" %}
                <button type="submit" class="btn btn-primary">Create task</button>
                <a class="btn btn-outline-secondary" href="{% url 'completed_tasks:dashboard' %}">Cancel</a>
            </form>
        </div></div>
    </div></div>
</div>
{% endblock %}
